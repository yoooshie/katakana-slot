<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141c45">
<title>お題スロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#22306B; --navy-d:#141c45; --navy-l:#34479a;
  --coral:#FF6F61; --coral-d:#c8473b;
  --yellow:#FFD166; --gold-d:#b98a2b;
  --cream:#fffaf0; --ink:#1a2350;
  --cell:clamp(52px, 9.4svh, 82px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b1030}
body{
  background:
    radial-gradient(circle at 20% 12%, rgba(255,209,102,.18) 0 2px, transparent 3px) 0 0/90px 90px,
    radial-gradient(circle at 70% 60%, rgba(255,111,97,.16) 0 2px, transparent 3px) 0 0/120px 120px,
    radial-gradient(ellipse at 50% 0%, #2f418f 0%, #141c45 55%, #0b1030 100%);
  color:#fff;
  font-family:'M PLUS Rounded 1c', system-ui, sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
.app{
  min-height:100svh; display:flex; align-items:center; justify-content:center;
  padding:max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
}

/* ---------- cabinet ---------- */
.machine{
  position:relative; width:100%; max-width:430px;
  padding:14px 14px 12px;
  border-radius:30px;
  background:linear-gradient(180deg, var(--navy-l) 0%, var(--navy) 28%, var(--navy-d) 100%);
  box-shadow:
    0 0 0 4px var(--yellow),
    0 0 0 8px var(--gold-d),
    0 0 0 10px #6b4f15,
    0 18px 40px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.25);
  display:flex; flex-direction:column; gap:10px;
}

/* topper */
.topper{
  position:relative; text-align:center;
  padding:16px 8px 12px;
  border-radius:20px;
  background:linear-gradient(180deg,#0e1433,#1c2766);
  box-shadow:inset 0 0 0 3px rgba(255,209,102,.5), inset 0 -10px 24px rgba(0,0,0,.45);
  overflow:hidden;
}
.bulbs{position:absolute; left:10px; right:10px; display:flex; justify-content:space-between; pointer-events:none}
.bulbs.top{top:5px} .bulbs.bottom{bottom:4px}
.bulb{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 6px 2px rgba(255,209,102,.8);animation:blink 1.2s steps(1) infinite}
.bulb:nth-child(even){background:var(--coral);box-shadow:0 0 6px 2px rgba(255,111,97,.8);animation-delay:.6s}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
.machine.win .bulb{animation-duration:.22s}
.logo-sub{font-size:11px; letter-spacing:.12em; color:rgba(255,255,255,.8); margin-top:4px}
.logo{
  font-family:'Dela Gothic One', sans-serif; font-size:clamp(30px, 10vw, 42px); line-height:1.15;
  color:var(--yellow);
  text-shadow:0 3px 0 var(--coral-d), 0 6px 0 #6b2a24, 0 0 18px rgba(255,209,102,.55);
  letter-spacing:.04em;
}
.logo .s{color:var(--coral); text-shadow:0 3px 0 #7a2a22, 0 6px 0 #3d1512, 0 0 18px rgba(255,111,97,.6)}

/* levels */
.levels{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.lv{
  border:0; border-radius:999px; padding:9px 4px 8px;
  font-size:15px; font-weight:800; letter-spacing:.02em;
  background:#0e1433; color:rgba(255,255,255,.6);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.15), 0 3px 0 #070a1c;
  transition:transform .08s;
}
.lv:active{transform:translateY(2px)}
.lv.on{
  background:linear-gradient(180deg,#ff8d82,var(--coral)); color:#fff;
  box-shadow:inset 0 0 0 2px #ffd0cb, 0 3px 0 var(--coral-d), 0 0 16px rgba(255,111,97,.7);
}
.lv:disabled{opacity:.45}
.lv.on:disabled{opacity:1}

/* window & reels */
.window{
  position:relative; padding:10px;
  border-radius:18px;
  background:linear-gradient(180deg,#05081a,#121a45);
  box-shadow:inset 0 0 0 3px var(--gold-d), inset 0 0 0 6px #05081a, 0 0 0 2px var(--yellow);
}
.reels, .stops{display:grid; grid-template-columns:1fr 1fr 2.15fr; gap:8px}
.reel{
  position:relative; height:calc(var(--cell) * 3); overflow:hidden;
  border-radius:10px;
  background:linear-gradient(90deg,#e9e1cf 0%, var(--cream) 18%, #fff 50%, var(--cream) 82%, #e9e1cf 100%);
}
.reel::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(5,8,26,.78) 0%, rgba(5,8,26,.15) 26%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(5,8,26,.15) 74%, rgba(5,8,26,.78) 100%);
}
.cells{position:absolute; inset:0; will-change:filter}
.reel.spinning .cells{filter:blur(1.3px)}
.cell{
  position:absolute; left:0; right:0; top:0; height:var(--cell);
  display:flex; align-items:center; justify-content:center;
  font-family:'Dela Gothic One', sans-serif; color:var(--ink);
  white-space:nowrap; line-height:1;
  will-change:transform;
}
.cell.seven{color:var(--coral); text-shadow:0 2px 0 var(--coral-d)}
.reel.stopped .cell:not(.center){opacity:.35}
.machine.win .reel .cell.center{animation:hit .5s ease-in-out infinite alternate}
@keyframes hit{from{color:var(--ink)}to{color:var(--coral)}}

/* payline */
.payline{position:absolute; left:4px; right:4px; top:calc(10px + var(--cell)); height:var(--cell); pointer-events:none}
.payline::before,.payline::after{content:""; position:absolute; left:6px; right:6px; height:3px; border-radius:2px; background:var(--coral); box-shadow:0 0 8px rgba(255,111,97,.9)}
.payline::before{top:-1px} .payline::after{bottom:-1px}
.payline i{position:absolute; top:50%; width:0; height:0; border:9px solid transparent; transform:translateY(-50%)}
.payline i.l{left:-6px; border-left-color:var(--yellow)}
.payline i.r{right:-6px; border-right-color:var(--yellow)}
.machine.win .payline::before,.machine.win .payline::after{background:var(--yellow); box-shadow:0 0 12px var(--yellow); animation:blink .3s steps(1) infinite}
.glass{position:absolute; inset:10px; border-radius:10px; pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 32%);
}

/* stop buttons */
.stops{padding:0 10px}
.stop{
  justify-self:center; width:46px; height:46px; border-radius:50%; border:0;
  background:radial-gradient(circle at 40% 35%, #5a6390, #2a3160 70%);
  box-shadow:0 4px 0 #090d24, inset 0 0 0 3px #11173a;
  font-size:10px; font-weight:800; color:rgba(255,255,255,.55); letter-spacing:.05em;
}
.stop.ready{
  background:radial-gradient(circle at 40% 35%, #ffb4ab, var(--coral) 60%, var(--coral-d));
  color:#fff; box-shadow:0 4px 0 #7a2a22, inset 0 0 0 3px #ffd0cb, 0 0 18px rgba(255,111,97,.95);
  animation:pulse .7s ease-in-out infinite alternate;
}
.stop.pressed{transform:translateY(3px); box-shadow:0 1px 0 #090d24, inset 0 0 0 3px #11173a}
@keyframes pulse{to{box-shadow:0 4px 0 #7a2a22, inset 0 0 0 3px #ffd0cb, 0 0 4px rgba(255,111,97,.4)}}

/* LCD */
.lcd{
  min-height:74px; border-radius:14px; padding:8px 12px;
  background:linear-gradient(180deg,#050a12,#0b1626);
  box-shadow:inset 0 0 0 2px #2c3a5c, inset 0 6px 14px rgba(0,0,0,.8);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  color:var(--yellow); text-shadow:0 0 8px rgba(255,209,102,.7);
  font-weight:800; font-size:16px; line-height:1.45;
}
.lcd .small{font-size:12px; color:#ffe7b0; letter-spacing:.2em}
.lcd .big{font-family:'Dela Gothic One',sans-serif; font-size:clamp(24px, 8.4vw, 34px); color:#fff; text-shadow:0 0 10px rgba(255,209,102,.9), 0 0 2px var(--yellow); line-height:1.2; white-space:nowrap}
.lcd .note{font-size:11px; color:#ffb4ab; text-shadow:none; margin-top:2px}

/* start */
.start{
  border:0; border-radius:999px; padding:14px 0 13px;
  font-family:'Dela Gothic One',sans-serif; font-size:26px; letter-spacing:.12em;
  background:linear-gradient(180deg,#ffe09a,var(--yellow) 45%,#f2b73f);
  color:var(--navy);
  box-shadow:0 7px 0 var(--gold-d), 0 9px 0 #6b4f15, 0 12px 20px rgba(0,0,0,.5), inset 0 2px 0 #fff3cf;
  transition:transform .06s, box-shadow .06s;
}
.start:active,.start.pressed{transform:translateY(6px); box-shadow:0 1px 0 var(--gold-d), 0 3px 0 #6b4f15, 0 4px 8px rgba(0,0,0,.5), inset 0 2px 0 #fff3cf}
.start.busy{filter:saturate(.5) brightness(.8); font-size:18px; letter-spacing:.06em}

/* footer */
.foot{display:flex; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,.75); padding:0 4px}
.foot .left{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.foot button{border:0; border-radius:999px; padding:6px 12px; background:rgba(255,255,255,.1); color:#fff; font-size:12px; font-weight:800}
.foot button:active{background:rgba(255,255,255,.22)}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0;
  background:#fff; color:var(--navy); font-weight:800; font-size:13px; padding:10px 16px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.4); transition:.25s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1; transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <div class="machine" id="machine">
    <div class="topper">
      <div class="bulbs top" id="bulbsTop"></div>
      <div class="logo-sub">カタカナーシ テレストレーション</div>
      <div class="logo">お題<span class="s">スロット</span></div>
      <div class="bulbs bottom" id="bulbsBottom"></div>
    </div>

    <div class="levels no-stop" id="levels">
      <button class="lv" data-lv="easy">①易しい</button>
      <button class="lv" data-lv="normal">②普通</button>
      <button class="lv" data-lv="hard">③難しい</button>
    </div>

    <div class="window">
      <div class="reels">
        <div class="reel"><div class="cells"></div></div>
        <div class="reel"><div class="cells"></div></div>
        <div class="reel"><div class="cells"></div></div>
      </div>
      <div class="payline"><i class="l"></i><i class="r"></i></div>
      <div class="glass"></div>
    </div>

    <div class="stops" aria-hidden="true">
      <button class="stop" tabindex="-1">STOP</button>
      <button class="stop" tabindex="-1">STOP</button>
      <button class="stop" tabindex="-1">STOP</button>
    </div>

    <div class="lcd" id="lcd" aria-live="polite"></div>

    <button class="start" id="start">スタート</button>

    <div class="foot no-stop">
      <span class="left" id="left"></span>
      <button id="mute" aria-label="音のオンオフ">🔊 音あり</button>
      <button id="reset">お題リセット</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

// ---------- お題 ----------
const DATA = {
  easy: { name: '①易しい', words: ['バナナ','テレビ','ケーキ','ピアノ','カメラ','トマト','パンダ','ライオン','サッカーボール','ハンバーガー','スマホ','ペンギン','アイスクリーム','ギター','ロケット','バス','ドーナツ','キリン','カレーライス','プール','ベッド','コップ','タオル','ピザ','トラック','ネクタイ','ハート','ゴリラ','コアラ','スプーン'] },
  normal: { name: '②普通', words: ['エレベーター','エスカレーター','ドライヤー','ジェットコースター','サンタクロース','ランドセル','シャンプー','マヨネーズ','ヘルメット','フライパン','ブランコ','トランプ','ポップコーン','サンドイッチ','カスタネット','ヘッドホン','リモコン','カーテン','ソファ','マフラー','キーボード','ペットボトル','オムライス','カンガルー','ハンモック','タンバリン','ストロー','スキー','テント','チョコレート'] },
  hard: { name: '③難しい', words: ['ホッチキス','ワイパー','ハムスター','フラミンゴ','カメレオン','ピラミッド','スフィンクス','マトリョーシカ','シャンデリア','ミラーボール','メリーゴーランド','ボウリング','バドミントン','フラフープ','ブーメラン','トランポリン','サーフィン','スカイダイビング','ペリカン','アルマジロ','クロワッサン','ティラミス','パエリア','キャンプファイヤー','サボテン','ウクレレ','バイオリン','オルゴール','プラネタリウム','シーソー'] }
};
const LEVELS = ['easy', 'normal', 'hard'];

// 小さい「ャ」などは前の字とくっつけて1音にする（シャ・ジェ・ティ など）
const SMALL = 'ャュョァィゥェォヮ';
function moras(w) {
  const out = [];
  for (const ch of w) {
    if (SMALL.includes(ch) && out.length) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out;
}
// 左：1音目 / 中：2音目 / 右：残り全部（2音のお題は右が「！」）
function parts(w) {
  const m = moras(w);
  if (m.length < 3) return [m[0], m[1] || '', '！'];
  return [m[0], m[1], m.slice(2).join('')];
}

// ---------- 保存（使えないときはメモリだけで動く） ----------
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const decks = {};
function loadDeck(lv) {
  const all = DATA[lv].words;
  let d = store.get('kks-deck-' + lv);
  if (!Array.isArray(d)) d = all.slice();
  d = d.filter(w => all.includes(w));
  decks[lv] = d;
}
LEVELS.forEach(loadDeck);
function draw(lv) {
  let refilled = false;
  if (!decks[lv].length) { decks[lv] = DATA[lv].words.slice(); refilled = true; }
  const d = decks[lv];
  const w = d.splice(Math.floor(Math.random() * d.length), 1)[0];
  store.set('kks-deck-' + lv, d);
  return { w, refilled };
}

let level = store.get('kks-level');
if (!LEVELS.includes(level)) level = 'easy';

// ---------- 音（Web Audio で合成） ----------
let AC = null, master = null, noiseBuf = null;
let muted = store.get('kks-muted') === true;
function ensureAudio() {
  try {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.8;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function env(g, t, a, peak, d) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function tone(f, at, dur, o = {}) {
  if (!AC) return;
  const t = AC.currentTime + at;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
  env(g, t, o.a || 0.004, o.vol || 0.12, dur);
  osc.connect(g).connect(master);
  osc.start(t); osc.stop(t + dur + 0.08);
}
function noise(at, dur, o = {}) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.5), AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + at;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.value = o.freq || 2000; f.Q.value = o.q || 1;
  const g = AC.createGain(); env(g, t, 0.002, o.vol || 0.2, dur);
  s.connect(f).connect(g).connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}
const snd = {
  blip() { tone(988, 0, 0.05, { vol: 0.08 }); tone(1480, 0.05, 0.06, { vol: 0.06 }); },
  lever() {
    noise(0, 0.07, { vol: 0.5, freq: 1400 });
    tone(320, 0, 0.22, { type: 'triangle', f2: 80, vol: 0.4 });
    tone(784, 0.1, 0.07, { vol: 0.08 }); tone(1175, 0.17, 0.1, { vol: 0.08 });
  },
  tick(n) {
    noise(0, 0.018, { vol: 0.14, freq: 3800, q: 4 });
    tone(n % 2 ? 190 : 150, 0, 0.03, { vol: 0.035 });
  },
  stop() {
    tone(150, 0, 0.2, { type: 'sine', f2: 50, vol: 0.7 });
    noise(0, 0.05, { vol: 0.45, freq: 900, q: 0.8 });
    tone(1046, 0, 0.04, { vol: 0.05 });
  },
  reach(n) {
    const scale = [523, 587, 659, 698, 784, 880, 988, 1047];
    const f = scale[n % scale.length];
    tone(f, 0, 0.09, { vol: 0.07 });
    tone(f * 2, 0, 0.05, { type: 'triangle', vol: 0.03 });
  },
  win() {
    [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.3], [784, 0.42], [1047, 0.52]].forEach(([f, t]) => tone(f, t, 0.11, { vol: 0.13 }));
    [523, 659, 784, 1047].forEach(f => tone(f, 0.66, 0.9, { type: 'triangle', vol: 0.09, a: 0.02 }));
    for (let i = 0; i < 12; i++) {
      const f = 2200 + Math.random() * 1600, t = 0.66 + i * 0.075;
      tone(f, t, 0.05, { type: 'sine', vol: 0.07 });
      tone(f * 1.5, t + 0.03, 0.06, { type: 'sine', vol: 0.05 });
    }
  }
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

let tickTimer = null, reachTimer = null;
function startTicks() { stopTicks(); let n = 0; tickTimer = setInterval(() => snd.tick(n++), 60); }
function stopTicks() { if (tickTimer) clearInterval(tickTimer); tickTimer = null; }
function startReach() { stopReach(); let n = 0; reachTimer = setInterval(() => snd.reach(n++), 120); }
function stopReach() { if (reachTimer) clearInterval(reachTimer); reachTimer = null; }

// ---------- DOM ----------
const $ = s => document.querySelector(s);
const machine = $('#machine'), lcd = $('#lcd'), startBtn = $('#start');
const stopBtns = [...document.querySelectorAll('.stop')];
const lvBtns = [...document.querySelectorAll('.lv')];

['#bulbsTop', '#bulbsBottom'].forEach(id => {
  const box = $(id);
  for (let i = 0; i < 16; i++) { const b = document.createElement('i'); b.className = 'bulb'; box.appendChild(b); }
});

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- リール ----------
const SPEED = 15;        // 1秒に回るマス数
const STOP_MS = 700;     // 止まるまでの減速時間
let cellH = 70;
let pools = [[], [], []];
function buildPools() {
  const ps = DATA[level].words.map(parts);
  pools = [0, 1, 2].map(i => ps.map(p => p[i]).filter(s => s && s !== '！'));
}

class Reel {
  constructor(el, i) {
    this.el = el; this.i = i;
    this.box = el.querySelector('.cells');
    this.cells = [];
    for (let j = 0; j < 6; j++) {
      const c = document.createElement('div'); c.className = 'cell';
      this.box.appendChild(c);
      this.cells.push({ el: c, txt: null, center: null });
    }
    this.pos = 0; this.syms = new Map(); this.state = 'stopped';
    this.el.classList.add('stopped');
  }
  sym(k) {
    if (!this.syms.has(k)) {
      const p = pools[this.i];
      this.syms.set(k, Math.random() < 0.08 ? '７' : p[Math.floor(Math.random() * p.length)]);
    }
    return this.syms.get(k);
  }
  fit(cell, txt) {
    const w = this.el.clientWidth;
    const len = Math.max(1, [...txt].length);
    const size = Math.min(cellH * 0.6, (w * 0.86) / len);
    cell.el.style.fontSize = size.toFixed(1) + 'px';
  }
  render(force) {
    const base = Math.floor(this.pos), center = Math.round(this.pos);
    for (let j = 0; j < 6; j++) {
      const k = base - 2 + j, c = this.cells[j];
      const txt = this.sym(k);
      if (force || c.txt !== txt) {
        c.el.textContent = txt;
        c.el.classList.toggle('seven', txt === '７');
        this.fit(c, txt);
        c.txt = txt;
      }
      const isC = k === center;
      if (c.center !== isC) { c.el.classList.toggle('center', isC); c.center = isC; }
      c.el.style.transform = 'translateY(' + ((1 + this.pos - k) * cellH).toFixed(2) + 'px)';
    }
    if (this.syms.size > 80) for (const k of this.syms.keys()) if (k < base - 6) this.syms.delete(k);
  }
  start(now) {
    this.state = 'spin'; this.t0 = now;
    this.el.classList.add('spinning'); this.el.classList.remove('stopped');
  }
  stop(target, now) {
    this.state = 'stopping'; this.from = this.pos;
    this.T = Math.ceil(this.pos) + 3;
    this.syms.set(this.T, target);
    this.ts = now;
  }
  update(dt, now) {
    if (this.state === 'spin') {
      const ramp = Math.min(1, (now - this.t0) / 260);
      this.pos += SPEED * ramp * ramp * dt;
    } else if (this.state === 'stopping') {
      const t = (now - this.ts) / STOP_MS;
      if (t >= 1) {
        this.pos = this.T; this.state = 'bounce'; this.ts = now;
        this.el.classList.remove('spinning');
        onLanded(this);
      } else {
        this.pos = this.from + (this.T - this.from) * (1 - Math.pow(1 - t, 3));
        if (t > 0.5) this.el.classList.remove('spinning');
      }
    } else if (this.state === 'bounce') {
      const t = (now - this.ts) / 170;
      if (t >= 1) { this.pos = this.T; this.state = 'stopped'; this.el.classList.add('stopped'); }
      else this.pos = this.T + 0.1 * Math.sin(Math.PI * t);
    } else return;
    this.render();
  }
}

const reels = [...document.querySelectorAll('.reel')].map((el, i) => new Reel(el, i));
// 最初の表示は「ス・ロ・ット」
['ス', 'ロ', 'ット'].forEach((s, i) => reels[i].syms.set(0, s));

function measure() {
  cellH = reels[0].el.clientHeight / 3 || 70;
  reels.forEach(r => r.render(true));
}

// ---------- 進行 ----------
let phase = 'idle';   // idle / spin / result
let nextStop = 0, topic = null, topicParts = null, refilled = false;
let spinStartAt = 0, lastStopAt = 0, resultAt = 0, landed = 0;

function setLcd(html) { lcd.innerHTML = html; }
function updateLeft() {
  $('#left').textContent = DATA[level].name + '　残り' + decks[level].length + '/' + DATA[level].words.length;
}
function updateUI() {
  lvBtns.forEach(b => {
    b.classList.toggle('on', b.dataset.lv === level);
    b.disabled = phase === 'spin';
  });
  stopBtns.forEach((b, i) => b.classList.toggle('ready', phase === 'spin' && i === nextStop));
  startBtn.classList.toggle('busy', phase === 'spin');
  startBtn.textContent = phase === 'spin' ? 'タップでストップ' : phase === 'result' ? 'もう一回' : 'スタート';
  updateLeft();
}
function idleMessage() { setLcd('難易度をえらんで<br>スタートを押してね'); }

function startSpin() {
  if (phase === 'spin') return;
  const now = performance.now();
  if (now - resultAt < 600) return;
  ensureAudio();
  machine.classList.remove('win');
  phase = 'spin'; nextStop = 0; landed = 0; topic = null; topicParts = null;
  spinStartAt = now;
  reels.forEach(r => r.start(now));
  snd.lever(); startTicks(); buzz(15);
  setLcd('画面をタップして<br>左のリールを止めよう');
  updateUI();
}

function stopNext() {
  if (phase !== 'spin' || nextStop > 2) return;
  const now = performance.now();
  if (now - spinStartAt < 600 || now - lastStopAt < 280) return;
  if (nextStop === 0) {
    const d = draw(level);
    topic = d.w; refilled = d.refilled; topicParts = parts(topic);
  }
  const btn = stopBtns[nextStop];
  btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 140);
  reels[nextStop].stop(topicParts[nextStop], now);
  lastStopAt = now; nextStop++;
  updateUI();
}

function onLanded(r) {
  landed++;
  snd.stop(); buzz(30);
  if (landed === 1) setLcd('お題が決まった！<br>タップで真ん中を止めよう');
  else if (landed === 2) { setLcd('リーチ！<br>タップで右を止めよう'); startReach(); }
  else finish();
}

function finish() {
  stopReach(); stopTicks();
  phase = 'result'; resultAt = performance.now();
  machine.classList.add('win');
  snd.win(); buzz([40, 60, 40]);
  setLcd('<div class="small">お題</div><div class="big">' + topic + '</div>' +
    (refilled ? '<div class="note">' + DATA[level].name + 'のお題がひと回りしたので、最初から出しています</div>' : ''));
  updateUI();
}

// 画面のどこをタップしても、次のリールが止まる
document.addEventListener('pointerdown', e => {
  if (phase !== 'spin') return;
  if (e.target.closest('.no-stop')) return;
  e.preventDefault();
  stopNext();
}, { passive: false });

startBtn.addEventListener('click', () => { if (phase !== 'spin') startSpin(); });

lvBtns.forEach(b => b.addEventListener('click', () => {
  if (phase === 'spin') return;
  ensureAudio(); snd.blip();
  level = b.dataset.lv; store.set('kks-level', level);
  buildPools();
  if (phase === 'result') { phase = 'idle'; machine.classList.remove('win'); }
  idleMessage();
  updateUI();
}));

function paintMute() { $('#mute').textContent = muted ? '🔇 音なし' : '🔊 音あり'; }
$('#mute').addEventListener('click', () => {
  muted = !muted; store.set('kks-muted', muted); paintMute();
  ensureAudio();
  if (master) master.gain.value = muted ? 0 : 0.8;
  if (!muted) snd.blip();
});

$('#reset').addEventListener('click', () => {
  if (phase === 'spin') return;
  if (!confirm('すべての難易度のお題を、もう一度出るようにしますか？')) return;
  LEVELS.forEach(lv => { decks[lv] = DATA[lv].words.slice(); store.set('kks-deck-' + lv, decks[lv]); });
  updateLeft(); toast('お題をリセットしました');
});

// iOS のピンチ拡大を止める
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- ループ ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  reels.forEach(r => r.update(dt, now));
  requestAnimationFrame(loop);
}

buildPools();
paintMute();
idleMessage();
updateUI();
measure();
window.addEventListener('resize', measure);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
